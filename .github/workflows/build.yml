name: Build Android APKs

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web app
        run: npm run build

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Configure per-CPU APKs and permissions
        run: node scripts/patch-android.mjs

      - name: Build APKs (armeabi-v7a, arm64-v8a, x86, x86_64, universal)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Collect APKs
        run: |
          mkdir -p out
          for f in android/app/build/outputs/apk/debug/*.apk; do
            n=$(basename "$f" .apk)
            n=${n#app-}
            n=${n%-debug}
            cp "$f" "out/SkyCast-${n}.apk"
          done
          ls -lh out

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: skycast-apks
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
