name: Build Android APKs

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract project ZIP and locate package.json
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "skycast-weather.zip" ]; then
            echo "ERROR: skycast-weather.zip was not found in the repository root."
            exit 1
          fi

          mkdir -p extracted-project
          unzip -oq skycast-weather.zip -d extracted-project

          PACKAGE_FILE="$(find extracted-project -type f -name package.json \
            -not -path '*/node_modules/*' | sort | head -n 1)"

          if [ -z "$PACKAGE_FILE" ]; then
            echo "ERROR: package.json was not found inside skycast-weather.zip."
            echo "The ZIP must contain the actual web app project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PACKAGE_FILE")"
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Install dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build web app
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm run build

      - name: Add Android platform (if missing)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi

      - name: Sync web assets into Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Configure Android APKs and permissions (if script exists)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f scripts/patch-android.mjs ]; then
            node scripts/patch-android.mjs
          else
            echo "scripts/patch-android.mjs not found; skipping optional patch."
          fi

      - name: Build Android debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Collect APKs
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          shopt -s nullglob
          files=(android/app/build/outputs/apk/debug/*.apk)

          if [ ${#files[@]} -eq 0 ]; then
            echo "ERROR: No APK files were generated."
            exit 1
          fi

          for f in "${files[@]}"; do
            n="$(basename "$f" .apk)"
            n="${n#app-}"
            n="${n%-debug}"
            cp "$f" "$GITHUB_WORKSPACE/out/SkyCast-${n}.apk"
          done

          ls -lh "$GITHUB_WORKSPACE/out"

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: skycast-apks
          path: out/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
